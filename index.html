<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aion Idea Card v11 — Star Placement A/B</title>
<style>
:root{--bg:#0b0e12;--panel:#11161b;--line:#d7dee6;--fill:#171c22;--muted:#7f8995;--guide:#f1c75b;--key:#75c8ff;--accessory:#b08cff;--safe-fill:rgba(241,199,91,.045)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#e9eef3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}body{padding:28px}.wrap{max-width:1040px;margin:auto}h1{margin:0 0 8px;font-size:20px;font-weight:650}.lead{margin:0;color:var(--muted);font-size:13px;line-height:1.65;max-width:900px}.toolbar{display:flex;gap:8px;align-items:center;margin:18px 0 20px;flex-wrap:wrap}button{border:1px solid #303944;background:#171d24;color:#d8e0e8;border-radius:9px;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer}button.active{background:#e7edf2;color:#11161b;border-color:#e7edf2}.legend{margin-left:auto;color:#7f8995;font-size:11px;display:flex;gap:13px;align-items:center;flex-wrap:wrap}.sw{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}.sw.safe{background:var(--guide)}.sw.key{background:var(--key)}.sw.acc{background:var(--accessory)}.headrow,.kind-row{display:grid;grid-template-columns:96px 1fr 1fr;gap:14px;align-items:center}.headrow{margin-bottom:8px;color:#8a95a1;font-size:11px;text-align:center}.headrow div:first-child{text-align:left}.kind-row{padding:11px 0;border-top:1px solid #20262d}.kind-name{font-size:12px;color:#cbd3dc}.kind-note{display:block;margin-top:3px;font-size:9px;color:#67727d}.stage{min-height:154px;display:grid;place-items:center;border:1px solid #242b33;border-radius:13px;background:var(--panel);overflow:visible}.card{position:relative;width:176px;height:116px;filter:drop-shadow(0 7px 18px rgba(0,0,0,.24));--safe-l:24px;--safe-r:24px;--safe-t:22px;--safe-b:22px;--key-x:29px}.card svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.fill *{fill:var(--fill);stroke:none}.stroke *{fill:none;stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}.safe-area{position:absolute;left:var(--safe-l);right:var(--safe-r);top:var(--safe-t);bottom:var(--safe-b);border:1px dashed var(--guide);background:var(--safe-fill);pointer-events:none;z-index:2}.keyline{position:absolute;left:var(--key-x);top:var(--safe-t);bottom:var(--safe-b);width:1px;border-left:1px dashed var(--key);pointer-events:none;z-index:3}.label-box{position:absolute;left:var(--key-x);right:var(--safe-r);top:var(--safe-t);bottom:var(--safe-b);z-index:4;display:flex;align-items:center;min-width:0}.label{width:100%;font-size:12px;line-height:1.36;font-weight:640;letter-spacing:.005em;white-space:normal;overflow-wrap:anywhere;text-align:left;color:#edf2f7}.star-inline{display:inline-block;margin-left:3px;color:#d7dde4;font-size:10px;line-height:1;vertical-align:.08em;white-space:nowrap}.star-accessory{display:none;position:absolute;right:calc(var(--safe-r) + 1px);top:50%;transform:translateY(-50%);z-index:5;width:14px;height:18px;place-items:center;color:#d7dde4;font-size:10px;line-height:1}.accessory-zone{display:none;position:absolute;right:var(--safe-r);top:var(--safe-t);bottom:var(--safe-b);width:18px;border:1px dashed var(--accessory);pointer-events:none;z-index:3}.star-on .variant-trailing .star-accessory{display:grid}.star-on .variant-trailing .label-box{right:calc(var(--safe-r) + 18px)}.star-on .variant-inline .star-inline{display:inline-block}body:not(.star-on) .star-inline{display:none}.show-guides.star-on .variant-trailing .accessory-zone{display:block}body:not(.show-guides) .safe-area,body:not(.show-guides) .keyline{display:none}.kind-melody{--safe-l:26px;--safe-r:26px;--safe-t:22px;--safe-b:22px;--key-x:31px}.kind-harmony{--safe-l:26px;--safe-r:26px;--safe-t:22px;--safe-b:22px;--key-x:31px}.kind-groove{--safe-l:24px;--safe-r:24px;--safe-t:22px;--safe-b:22px;--key-x:29px}.kind-sound{--safe-l:26px;--safe-r:26px;--safe-t:22px;--safe-b:22px;--key-x:31px}.kind-lyrics{--safe-l:21.5px;--safe-r:24.5px;--safe-t:20px;--safe-b:20px;--key-x:27.5px}.kind-structure{--safe-l:22px;--safe-r:22px;--safe-t:20px;--safe-b:20px;--key-x:28px}.kind-other{--safe-l:22px;--safe-r:22px;--safe-t:20px;--safe-b:20px;--key-x:28px}.rule{margin-top:18px;padding:13px 15px;border:1px solid #242b33;border-radius:12px;color:#87929e;font-size:12px;line-height:1.7}@media(max-width:720px){body{padding:16px}.headrow{display:none}.kind-row{grid-template-columns:70px 1fr;gap:9px}.kind-name{grid-row:1 / span 2}.stage{min-height:140px}.card{transform:scale(.86);margin:-8px}.legend{width:100%;margin-left:0}}
</style>
</head>
<body class="star-on" data-sample="long">
<div class="wrap"><h1>Aion Idea Card v11 — ★ Placement A/B</h1><p class="lead">v10の全文label safe area / keylineを固定し、★だけを比較します。Aは本文末尾に続くinline、Bは右側の独立trailing accessory。★OFFでv10相当に戻ります。</p><div class="toolbar"><button id="starBtn" class="active">★ ON</button><button id="guidesBtn">Guides OFF</button><button class="sample active" data-sample="long">Long</button><button class="sample" data-sample="short">Short</button><button class="sample" data-sample="stress">Stress</button><div class="legend"><span><i class="sw safe"></i>safe area</span><span><i class="sw key"></i>keyline</span><span><i class="sw acc"></i>accessory zone</span></div></div><div class="headrow"><div>Kind</div><div>A — inline ★</div><div>B — trailing accessory ★</div></div><div id="rows"></div><div class="rule">見るポイント：★あり/なしで重心が崩れないか、全文labelを邪魔しないか、7種類で★の存在感が揃って見えるか。</div></div>
<script>
const specs={melody:{name:'Melody',scale:1.025,offsetX:0,path:'M36 8 H168 V80 L140 108 H8 V36 Z',safe:[26,26,22,22],key:31,short:'サビ頭の上昇メロディ',long:'サビ前で一度だけ上に抜けるメロディ',stress:'サビ前で一度だけ上に抜けて、そのあと語尾だけ静かに落ちるメロディ'},harmony:{name:'Harmony',scale:1.030,offsetX:0,path:'M22 8 H154 L168 44 V72 L154 108 H22 L8 72 V44 Z',safe:[26,26,22,22],key:31,short:'最後だけsus4を残す',long:'最後だけsus4を残して解決を遅らせる',stress:'最後の2小節だけsus4を残して、解決する場所を次のフレーズ頭まで遅らせる'},groove:{name:'Groove',scale:1.012,offsetX:0,path:'M18 8 H158 V22 H168 V94 H158 V108 H18 V94 H8 V22 H18 Z',safe:[24,24,22,22],key:29,short:'ハットを半拍前へ',long:'キックを抜いてハイハットだけ半拍前に出す',stress:'2拍目のキックを抜いて、ハイハットだけ半拍前へ出しながら最後は元の位置へ戻す'},sound:{name:'Sound',scale:1.014,offsetX:0,path:'M22 8 H154 Q168 22 168 40 V76 Q168 94 154 108 H22 Q8 94 8 76 V40 Q8 22 22 8 Z',safe:[26,26,22,22],key:31,short:'硬い輪郭＋霞む余韻',long:'輪郭は硬いけど余韻だけ少し霞ませる',stress:'アタックの輪郭は硬いまま、余韻だけを少し霞ませて奥へ引っ込ませる質感'},lyrics:{name:'Lyrics',scale:1.015,offsetX:1.5,path:'M8 8 H144 L168 30 V86 L144 108 H8 Z',safe:[21.5,24.5,20,20],key:27.5,short:'最後の一語を飲み込む',long:'言い切らずに最後の一語だけ飲み込む',stress:'ここでは言い切らず、最後の一語だけ飲み込んで次の行に意味を残す'},structure:{name:'Structure',scale:1,offsetX:0,rect:[8,8,160,100],safe:[22,22,20,20],key:28,short:'2番後に8小節の空白',long:'2番サビ後に8小節だけ静かな空白を作る',stress:'2番サビの直後に8小節だけ静かな空白を作り、そのあと一気に最終セクションへ戻る'},other:{name:'Other',scale:1.005,offsetX:0,path:'M18 8 H158 L168 18 V98 L158 108 H18 L8 98 V18 Z',safe:[22,22,20,20],key:28,short:'違和感として残しておく',long:'まだ役割は決めず違和感として残しておく',stress:'今は役割を決めず、消すほどではない違和感として残して次の試聴で判断する'}};const order=['melody','harmony','groove','sound','lyrics','structure','other'];
function svg(s){const g=s.path?`<path d="${s.path}"/>`:`<rect x="${s.rect[0]}" y="${s.rect[1]}" width="${s.rect[2]}" height="${s.rect[3]}"/>`;const t=`translate(${88+s.offsetX} 58) scale(${s.scale}) translate(-88 -58)`;return `<svg viewBox="0 0 176 116"><g transform="${t}"><g class="fill">${g}</g><g class="stroke">${g}</g></g></svg>`}function card(k,v){const s=specs[k];return `<div class="stage"><div class="card kind-${k} variant-${v}" data-kind="${k}">${svg(s)}<div class="safe-area"></div><div class="keyline"></div>${v==='trailing'?'<div class="accessory-zone"></div><div class="star-accessory">★</div>':''}<div class="label-box"><div class="label"><span class="label-text">${s.long}</span>${v==='inline'?'<span class="star-inline">★</span>':''}</div></div></div></div>`}const rows=document.getElementById('rows');order.forEach(k=>{const s=specs[k],r=document.createElement('div');r.className='kind-row';r.innerHTML=`<div class="kind-name">${s.name}<span class="kind-note">key ${s.key}px</span></div>${card(k,'inline')}${card(k,'trailing')}`;rows.appendChild(r)});function setSample(m){document.querySelectorAll('.card').forEach(c=>c.querySelector('.label-text').textContent=specs[c.dataset.kind][m]);document.querySelectorAll('.sample').forEach(b=>b.classList.toggle('active',b.dataset.sample===m));document.body.dataset.sample=m}document.querySelectorAll('.sample').forEach(b=>b.onclick=()=>setSample(b.dataset.sample));document.getElementById('starBtn').onclick=e=>{const on=document.body.classList.toggle('star-on');e.currentTarget.classList.toggle('active',on);e.currentTarget.textContent=on?'★ ON':'★ OFF'};document.getElementById('guidesBtn').onclick=e=>{const on=document.body.classList.toggle('show-guides');e.currentTarget.classList.toggle('active',on);e.currentTarget.textContent=on?'Guides ON':'Guides OFF'};
</script></body></html>
